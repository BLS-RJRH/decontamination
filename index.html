<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบบันทึกการตรวจสอบห้องล้างตัว - ER & EMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }

    /* ควบคุมสีผ่าน CSS เมื่อคลิกเลือก (ทำงานเสถียร ไม่ขึ้นกับ JS) */
    .btn-normal:has(input:checked) {
      border-color: #10b981 !important; /* emerald-500 */
      background-color: #ecfdf5 !important; /* emerald-50 */
      color: #065f46 !important; /* emerald-800 */
      box-shadow: 0 1px 3px 0 rgba(16, 185, 129, 0.2);
    }
    .btn-normal:has(input:checked) svg,
    .btn-normal:has(input:checked) i {
      color: #059669 !important;
      opacity: 1 !important;
    }

    .btn-abnormal:has(input:checked) {
      border-color: #f43f5e !important; /* rose-500 */
      background-color: #fff1f2 !important; /* rose-50 */
      color: #9f1239 !important; /* rose-800 */
      box-shadow: 0 1px 3px 0 rgba(244, 63, 94, 0.2);
    }
    .btn-abnormal:has(input:checked) svg,
    .btn-abnormal:has(input:checked) i {
      color: #e11d48 !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-8 px-4 sm:px-6">
  <div class="max-w-2xl mx-auto space-y-5">

    <!-- Header Card -->
    <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white rounded-2xl shadow-lg border border-slate-700/50 p-6 sm:p-8 relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 text-white/5 pointer-events-none">
        <i data-lucide="shield-alert" class="w-48 h-48"></i>
      </div>
      <div class="relative z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/20 border border-blue-400/30 text-blue-200 text-xs font-medium tracking-wide mb-3">
          <i data-lucide="file-check" class="w-3.5 h-3.5"></i> RJR-FM-FMS-003-00
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">แบบบันทึกการตรวจเช็คห้องล้างตัว</h1>
        <p class="text-blue-200 text-sm mt-1 font-light">Check decontamination room — แผนกอุบัติเหตุและฉุกเฉิน (ER & EMS)</p>
        <div class="mt-4 pt-3 border-t border-blue-800/60 flex items-center gap-1.5 text-xs text-amber-300">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
          <span>จำเป็นต้องประเมินและกรอกข้อมูลให้ครบทุกข้อ (*)</span>
        </div>
      </div>
    </div>

    <!-- Form Section -->
    <form id="checkForm" class="space-y-4">
      
      <!-- ผู้บันทึก -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 hover:border-blue-400 transition-colors">
        <label for="recorderName" class="flex items-center gap-2 font-semibold text-slate-800 text-base mb-2">
          <i data-lucide="user" class="w-4 h-4 text-blue-600"></i>
          ชื่อผู้บันทึก <span class="text-rose-500">*</span>
        </label>
        <p class="text-xs text-slate-500 mb-3">กรุณาเลือกชื่อเจ้าหน้าที่ผู้ดำเนินการตรวจสอบ</p>
        <div class="relative">
          <select id="recorderName" required class="w-full sm:w-80 p-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-700 text-sm outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition-all appearance-none cursor-pointer">
            <option value="" disabled selected>-- เลือกรายชื่อผู้บันทึก --</option>
            <option value="นายพลธร บัวแย้ม">นายพลธร บัวแย้ม</option>
            <option value="นายชัยชนะ เล้านิยมยินดี">นายชัยชนะ เล้านิยมยินดี</option>
            <option value="นายธวัชชัย แสงโนราช">นายธวัชชัย แสงโนราช</option>
            <option value="นายศุภกร ชิตนุรัตน์">นายศุภกร ชิตนุรัตน์</option>
            <option value="นายธิติภพ พูลเกิด">นายธิติภพ พูลเกิด</option>
            <option value="นายภาณุภณ วชิรหิรัญกุล">นายภาณุภณ วชิรหิรัญกุล</option>
            <option value="นายธนาเทพ ฉายบุตร">นายธนาเทพ ฉายบุตร</option>
            <option value="นายพลพรรธน์ คีตะพันธ์สังวร">นายพลพรรธน์ คีตะพันธ์สังวร</option>
          </select>
          <div class="absolute inset-y-0 left-0 sm:left-72 flex items-center pr-3 pointer-events-none text-slate-400">
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </div>
        </div>
      </div>

      <!-- รายการตรวจสอบ 9 ข้อ -->
      <div id="questionsList" class="space-y-4"></div>

      <!-- Actions -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex items-center justify-between gap-4 mt-6">
        <button type="button" onclick="resetForm()" class="inline-flex items-center gap-1.5 px-4 py-2.5 text-sm font-medium text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          ล้างข้อมูล (Clear)
        </button>

        <button type="submit" id="submitBtn" class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-700 to-indigo-700 hover:from-blue-800 hover:to-indigo-800 text-white font-medium px-8 py-2.5 rounded-xl shadow-md shadow-blue-500/20 transition-all active:scale-[0.98]">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>บันทึกผลการตรวจสอบ</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBhRWwJWjlYbCfqEzvcYna3cAkGiQepreJSla9GUt0oN0ZQrNB60ysM9_5fr2YsGlFFg/exec";

    const questions = [
      "1. การติดตั้งอุปกรณ์ในพื้นที่ ที่มั่นคง",
      "2. ไม่มีสิ่งกีดขวางบริเวณอ่างล้างตา",
      "3. สะอาด ไม่มีคราบสกปรก",
      "4. สภาพอุปกรณ์พร้อมใช้งาน",
      "5. น้ำมีความสะอาด ไม่มีกลิ่น/สีผิดปกติ",
      "6. แรงดันน้ำออกทั้งสองหัวอย่างสมดุล",
      "7. มีการระบายน้ำทิ้งอย่างเหมาะสม",
      "8. เปิดน้ำทดสอบได้ทันที ไม่มีการรั่วซึม",
      "9. มีการติดตั้งป้ายบ่งชี้อุปกรณ์เห็นชัดเจน"
    ];

    const container = document.getElementById("questionsList");

    questions.forEach((title, idx) => {
      const qNum = idx + 1;
      const card = `
        <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-200/80 space-y-4">
          <div>
            <h2 class="font-medium text-slate-800 text-base leading-relaxed">
              ${title} <span class="text-rose-500 font-bold">*</span>
            </h2>
          </div>

          <!-- ตัวเลือก 2 สถานะ: ปกติ / ผิดปกติ -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 text-sm">
            
            <!-- ปกติ -->
            <label class="btn-normal flex items-center gap-2.5 p-3.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition text-slate-600">
              <input type="radio" name="q${qNum}" value="ปกติ" required onchange="toggleReason(${qNum}, false)" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
              <span class="font-medium flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-4 h-4 opacity-40"></i> ปกติ
              </span>
            </label>

            <!-- ผิดปกติ -->
            <label class="btn-abnormal flex items-center gap-2.5 p-3.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition text-slate-600">
              <input type="radio" name="q${qNum}" value="ผิดปกติ" onchange="toggleReason(${qNum}, true)" class="w-4 h-4 text-rose-600 focus:ring-rose-500">
              <span class="font-medium flex items-center gap-2">
                <i data-lucide="x-circle" class="w-4 h-4 opacity-40"></i> ผิดปกติ
              </span>
            </label>

          </div>

          <!-- กล่องระบุเหตุผลความผิดปกติ -->
          <div id="reason_box_${qNum}" class="hidden pt-1">
            <input type="text" id="reason_text_${qNum}" placeholder="ระบุเหตุผล / รายละเอียดความผิดปกติ... *" class="w-full border border-rose-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-700 bg-rose-50/30 focus:ring-2 focus:ring-rose-500 outline-none transition">
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', card);
    });

    lucide.createIcons();

    // จัดการเปิด/ปิดกล่องพิมพ์เหตุผล
    function toggleReason(qNum, isAbnormal) {
      const reasonBox = document.getElementById(`reason_box_${qNum}`);
      const reasonInput = document.getElementById(`reason_text_${qNum}`);

      if (isAbnormal) {
        reasonBox.classList.remove('hidden');
        reasonInput.required = true;
        reasonInput.focus();
      } else {
        reasonBox.classList.add('hidden');
        reasonInput.required = false;
        reasonInput.value = "";
      }
    }

    function resetForm() {
      if (confirm("ต้องการล้างข้อมูลฟอร์มทั้งหมดหรือไม่?")) {
        document.getElementById("checkForm").reset();
        for (let i = 1; i <= 9; i++) {
          toggleReason(i, false);
        }
      }
    }

    document.getElementById("checkForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังบันทึก...`;
      lucide.createIcons();

      const payload = {
        recorderName: document.getElementById("recorderName").value
      };

      for (let i = 1; i <= 9; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (!selected) {
          alert(`กรุณาตรวจสอบและประเมินให้ครบทุกข้อ (ข้อ: ${questions[i-1]})`);
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> <span>บันทึกผลการตรวจสอบ</span>`;
          lucide.createIcons();
          return;
        }

        if (selected.value === "ผิดปกติ") {
          const reason = document.getElementById(`reason_text_${i}`).value.trim();
          payload[`q${i}`] = reason ? reason : "ผิดปกติ";
        } else {
          payload[`q${i}`] = "ปกติ";
        }
      }

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("✓ บันทึกผลการตรวจสอบสำเร็จเรียบร้อยแล้ว");
        document.getElementById("checkForm").reset();
        for (let i = 1; i <= 9; i++) {
          toggleReason(i, false);
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> <span>บันทึกผลการตรวจสอบ</span>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
